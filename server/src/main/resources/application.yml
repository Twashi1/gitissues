logging:
  level:
    org.flywaydb: DEBUG

spring:
  datasource:
    url: ${DB_URL:jdbc:sqlite:gitissues.db}
    username: ""
    password: ""
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 10000
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false 

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none

